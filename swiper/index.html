<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiper Practice</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="swiper">
      <div class="swiper-wrapper">
        <div
          class="swiper-slide slide"
          style="background-image: url('./img/slide-1.jpg')"
        ></div>
        <div
          class="swiper-slide slide"
          style="background-image: url('./img/slide-2.jpg')"
        ></div>
        <div
          class="swiper-slide slide"
          style="background-image: url('./img/slide-3.jpg')"
        ></div>
        <div
          class="swiper-slide slide"
          style="background-image: url('./img/slide-4.jpg')"
        ></div>
        <div
          class="swiper-slide slide"
          style="background-image: url('./img/slide-5.jpg')"
        ></div>
      </div>

      <div class="swiper-pagination"></div>

      <div class="swiper-prev">
        <span class="icon-arrow-left"></span>
      </div>
      <div class="swiper-next">
        <span class="icon-arrow-right"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="./main.js"></script>
  </body>
</html>
